<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TurfDiary</title>
<meta name="description" content="Your lawn’s diary: track yard work, products, costs, reminders and progress photos.">
<meta name="theme-color" content="#2E6A39">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="root"></div>
<div id="sheet"></div>
<noscript><p style="padding:16px">TurfDiary needs JavaScript turned on.</p></noscript>
<script src="app.js"></script>
<script>
if("serviceWorker" in navigator){
  /* Faster updates: check for a new version on open and whenever the app comes back to the screen,
     then switch to it automatically (or right after a form is closed). */
  var hadController=!!navigator.serviceWorker.controller,reloading=false;
  navigator.serviceWorker.addEventListener("controllerchange",function(){
    if(!hadController||reloading)return;
    function go(){if(reloading)return;reloading=true;try{sessionStorage.setItem("td-updated","1")}catch(e){}location.reload()}
    if(document.querySelector("#sheet .sheet,#sheet2 .sheet,#mapview,#scanview")){var iv=setInterval(function(){if(!document.querySelector("#sheet .sheet,#sheet2 .sheet,#mapview,#scanview")){clearInterval(iv);go()}},1000)}else go();
  });
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(function(reg){
      document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")reg.update().catch(function(){})});
    }).catch(function(){});
    try{if(sessionStorage.getItem("td-updated")){sessionStorage.removeItem("td-updated");setTimeout(function(){if(window.tdToast)tdToast("TurfDiary updated to the latest version")},600)}}catch(e){}
  });
}
</script>
</body>
</html>
